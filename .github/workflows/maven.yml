name: Java CI with Maven and Selenium

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-login-success:
    name: Run Login Success Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Execute Login Success Scenario
      run: |
        mvn clean test -Dtest=LoginTest#testLoginSuccess -Dheadless=true

    - name: Archive Success Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: success-test-reports
        path: target/surefire-reports/

  test-login-failure:
    name: Run Login Failure Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Execute Login Failure Scenario
      run: |
        mvn clean test -Dtest=LoginTest#testLoginFailure -Dheadless=true

    - name: Archive Failure Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failure-test-reports
        path: target/surefire-reports/
